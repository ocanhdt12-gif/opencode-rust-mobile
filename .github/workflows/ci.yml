name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo tools (nextest + machete)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --workspace --release
      - name: Test (nextest)
        run: cargo nextest run --workspace
      - name: Doctests
        run: cargo test --workspace --doc
      - name: Unused deps (machete)
        run: cargo machete --with-metadata

  security:
    name: supply-chain audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Bundle mobile — chạy khi project con đã có app Dioxus thật.
  # Tách runner: android trên ubuntu, ios trên macos (iOS chỉ build được trên macOS).
  # Để continue-on-error vì template tooling chưa phải app Dioxus hoàn chỉnh;
  # project con bỏ continue-on-error khi đã có app.
  android:
    name: bundle android (.apk/.aab)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked || true
      - name: Bundle android
        run: dx bundle --platform android --release || echo "⚠️ cần app Dioxus thật + Android NDK"
