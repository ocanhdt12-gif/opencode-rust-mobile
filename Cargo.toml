[workspace]
resolver = "3"
members = ["crates/core", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = ""
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
opencode-core = { path = "crates/core" }
dioxus = { version = "0.7", default-features = false }
